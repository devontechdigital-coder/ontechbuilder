services:
  postgres:
    image: postgres:16-alpine
    container_name: stackbuilder-postgres
    environment:
      POSTGRES_USER: stackbuilder
      POSTGRES_PASSWORD: stackbuilder
      POSTGRES_DB: stackbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackbuilder -d stackbuilder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
